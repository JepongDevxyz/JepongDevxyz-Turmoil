<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JepongDevxyz - TerMax</title>

  <script src="https://cdn.jsdelivr.net/npm/buffer@6.0.3/index.min.js"></script>
  <script>
    window.Buffer = window.buffer.Buffer;
    if (!window.Buffer.isBuffer) {
      window.Buffer.isBuffer = function(b) {
        return !!(b && b._isBuffer);
      };
    }
  </script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <script src="https://unpkg.com/@isomorphic-git/lightning-fs"></script>
  <script src="https://unpkg.com/isomorphic-git@1.25.0/index.umd.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      background-color: #000;
      color: #00ff66;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: monospace;
    }
    
    #app-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Tab Bar Styling */
    .tabs-bar {
      display: flex;
      align-items: center;
      background-color: #111;
      border-bottom: 1px solid #333;
      overflow-x: auto;
      white-space: nowrap;
      flex-shrink: 0;
      height: 42px;
      padding: 0 4px;
    }

    .tab-item {
      background-color: #1e1e1e;
      color: #888;
      border: 1px solid #333;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      padding: 6px 12px;
      font-size: 12px;
      margin-right: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      user-select: none;
      transition: background-color 0.2s, color 0.2s;
    }

    .tab-item.active {
      background-color: #000;
      color: #00ff66;
      border-color: #00ff66;
      font-weight: bold;
    }

    .tab-close {
      color: #ff5555;
      font-weight: bold;
      font-size: 11px;
      border-radius: 50%;
      padding: 0 4px;
    }
    .tab-close:hover {
      background-color: #ff5555;
      color: #000;
    }

    .tab-actions {
      display: flex;
      gap: 4px;
      margin-left: 4px;
      flex-shrink: 0;
    }

    .add-tab-btn, .close-all-btn, .config-btn {
      border: none;
      border-radius: 4px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }

    .add-tab-btn {
      background-color: #00ff66;
      color: #000;
    }

    .close-all-btn {
      background-color: #2a1111;
      color: #ff5555;
      border: 1px solid #ff5555;
    }

    .config-btn {
      background-color: #222;
      color: #00ff66;
      border: 1px solid #00ff66;
    }

    #terminal-container {
      flex: 1;
      width: 100%;
      padding: 5px;
      overflow: hidden;
      position: relative;
    }

    .term-wrapper {
      width: 100%;
      height: 100%;
      display: none;
    }
    .term-wrapper.active {
      display: block;
    }
    
    /* Touch Controls */
    .termux-toolbar {
      height: 48px;
      width: 100%;
      display: flex;
      align-items: center;
      background-color: #1a1a1a;
      border-top: 2px solid #00ff66;
      padding: 0 8px;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      z-index: 9999;
      user-select: none;
      -webkit-user-select: none;
      flex-shrink: 0;
    }

    .termux-btn {
      background-color: #2a2a2a;
      color: #00ff66;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: bold;
      font-family: monospace;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      flex-shrink: 0;
    }
    .termux-btn.auto-btn {
      background-color: #00ff66;
      color: #000;
      border: 1px solid #00ff66;
    }
    .termux-btn:active {
      background-color: #00ff66;
      color: #000;
    }

    /* Modern Notification & Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-card {
      background: #141414;
      border: 1px solid #00ff66;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,255,102,0.15);
      transform: scale(0.9);
      transition: transform 0.25s ease;
      color: #fff;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-overlay.active .modal-card {
      transform: scale(1);
    }
    .modal-title {
      font-size: 16px;
      font-weight: bold;
      color: #00ff66;
      margin-bottom: 10px;
    }
    .modal-body {
      font-size: 13px;
      color: #ccc;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .input-label {
      font-size: 11px;
      color: #00ff66;
      margin-top: 8px;
      display: block;
    }
    .modal-input {
      width: 100%;
      background: #000;
      border: 1px solid #333;
      border-radius: 6px;
      color: #00ff66;
      padding: 8px 10px;
      font-family: monospace;
      outline: none;
      margin-top: 4px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .modal-input:focus {
      border-color: #00ff66;
    }
    .toggle-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
      background: #0a0a0a;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #222;
    }
    .toggle-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #ddd;
    }
    .toggle-item input[type="checkbox"] {
      cursor: pointer;
      accent-color: #00ff66;
      width: 16px;
      height: 16px;
    }
    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
    }
    .modal-btn {
      background: #222;
      border: 1px solid #444;
      color: #fff;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: bold;
    }
    .modal-btn.primary {
      background: #00ff66;
      color: #000;
      border: none;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <div class="tabs-bar" id="tabsBar">
      <div class="tab-actions">
        <button class="add-tab-btn" onclick="addNewTab()" title="New Tab (Max 12)">+ New Tab</button>
        <button class="config-btn" onclick="openConfigModal()" title="GitHub Configuration">⚙️ Setup</button>
        <button class="close-all-btn" onclick="confirmCloseAllTabs()" title="Close All Tabs">✕ Close All</button>
      </div>
    </div>

    <div id="terminal-container"></div>

    <div class="termux-toolbar">
      <button class="termux-btn auto-btn" onclick="runAutoWorkflow()">Auto Push</button>
      <button class="termux-btn" onclick="handlePaste()">Paste</button>
      <button class="termux-btn" onclick="handleArrowUp()">↑</button>
      <button class="termux-btn" onclick="handleArrowDown()">↓</button>
      <button class="termux-btn" onclick="handleEnter()">Enter ↩</button>
      <button class="termux-btn" onclick="handleUndo()">Undo</button>
      <button class="termux-btn" onclick="handleRedo()">Redo</button>
      <button class="termux-btn" onclick="resetAllTabs()" style="color: #ff5555; border-color: #ff5555;">Clear Saved</button>
    </div>
  </div>

  <div class="modal-overlay" id="customModal">
    <div class="modal-card">
      <div class="modal-title" id="modalTitle">Notification</div>
      <div class="modal-body" id="modalBody">Message text goes here...</div>
      <div id="modalCustomForm" style="display: none;"></div>
      <div class="modal-buttons" id="modalButtons">
        <button class="modal-btn primary" id="modalConfirmBtn">OK</button>
      </div>
    </div>
  </div>

  <script>
    const MAX_TABS = 12;
    const fs = new LightningFS('JepongFS');
    const pfs = fs.promises;

    const http = {
      async request({ url, method, headers, body }) {
        let reqBody = body;
        if (body && typeof body[Symbol.asyncIterator] === 'function') {
          const chunks = [];
          for await (const chunk of body) chunks.push(chunk);
          reqBody = Buffer.concat(chunks);
        }

        const res = await fetch(url, { method, headers, body: reqBody });

        return {
          url: res.url,
          method: method,
          statusCode: res.status,
          statusMessage: res.statusText,
          headers: Object.fromEntries(res.headers.entries()),
          body: (async function* () {
            const reader = res.body.getReader();
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              yield value;
            }
          })()
        };
      }
    };

    // Global state
    let tabs = [];
    let activeTabId = null;

    /* --- GitHub User Settings Helper --- */
    function getSavedGitHubConfig(tabId = activeTabId) {
      const tabConfigStr = sessionStorage.getItem(`gh_config_tab_${tabId}`);
      if (tabConfigStr) {
        return JSON.parse(tabConfigStr);
      }

      const globalRemAll = localStorage.getItem('gh_rem_all') === 'true';
      return {
        username: (globalRemAll ? localStorage.getItem('gh_username') : '') || '',
        email: (globalRemAll ? localStorage.getItem('gh_email') : '') || '',
        repoUrl: (globalRemAll ? localStorage.getItem('gh_repourl') : '') || '',
        token: (globalRemAll ? localStorage.getItem('gh_token') : '') || '',
        rememberTab: false,
        rememberAll: globalRemAll
      };
    }

    function saveGitHubConfig(cfg, tabId = activeTabId) {
      if (cfg.rememberTab) {
        sessionStorage.setItem(`gh_config_tab_${tabId}`, JSON.stringify({
          username: cfg.username.trim(),
          email: cfg.email.trim(),
          repoUrl: cfg.repoUrl.trim(),
          token: cfg.token.trim(),
          rememberTab: true,
          rememberAll: false
        }));
      } else {
        sessionStorage.removeItem(`gh_config_tab_${tabId}`);
      }

      if (cfg.rememberAll) {
        localStorage.setItem('gh_rem_all', 'true');
        localStorage.setItem('gh_username', cfg.username.trim());
        localStorage.setItem('gh_email', cfg.email.trim());
        localStorage.setItem('gh_repourl', cfg.repoUrl.trim());
        localStorage.setItem('gh_token', cfg.token.trim());
      } else {
        localStorage.setItem('gh_rem_all', 'false');
        if (!cfg.rememberTab) {
          localStorage.removeItem('gh_username');
          localStorage.removeItem('gh_email');
          localStorage.removeItem('gh_repourl');
          localStorage.removeItem('gh_token');
        }
      }
    }

    /* --- Modern Modal System --- */
    function showModal({ title, message, customFormHTML = null, showCancel = false, onConfirm }) {
      const modal = document.getElementById('customModal');
      const titleEl = document.getElementById('modalTitle');
      const bodyEl = document.getElementById('modalBody');
      const customFormEl = document.getElementById('modalCustomForm');
      const buttonsEl = document.getElementById('modalButtons');

      titleEl.innerText = title || 'Notice';
      bodyEl.innerText = message || '';
      
      if (customFormHTML) {
        customFormEl.innerHTML = customFormHTML;
        customFormEl.style.display = 'block';
      } else {
        customFormEl.innerHTML = '';
        customFormEl.style.display = 'none';
      }

      buttonsEl.innerHTML = '';
      if (showCancel) {
        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'modal-btn';
        cancelBtn.innerText = 'Cancel';
        cancelBtn.onclick = () => closeModal();
        buttonsEl.appendChild(cancelBtn);
      }

      const confirmBtn = document.createElement('button');
      confirmBtn.className = 'modal-btn primary';
      confirmBtn.innerText = 'OK';
      confirmBtn.onclick = () => {
        closeModal();
        if (onConfirm) onConfirm();
      };
      buttonsEl.appendChild(confirmBtn);

      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('customModal').classList.remove('active');
    }

    function openConfigModal(onSavedCallback = null) {
      const activeTab = getActiveTab();
      const cfg = getSavedGitHubConfig(activeTab ? activeTab.id : null);
      
      const formHTML = `
        <label class="input-label">GitHub Username:</label>
        <input type="text" id="cfg_user" class="modal-input" placeholder="e.g. JepongDevxyz" value="${cfg.username}" />
        <label class="input-label">GitHub Email:</label>
        <input type="text" id="cfg_email" class="modal-input" placeholder="e.g. user@gmail.com" value="${cfg.email}" />
        <label class="input-label">Target Repository URL:</label>
        <input type="text" id="cfg_repo" class="modal-input" placeholder="https://github.com/user/repo.git" value="${cfg.repoUrl}" />
        <label class="input-label">Personal Access Token (PAT):</label>
        <input type="password" id="cfg_token" class="modal-input" placeholder="ghp_xxxxxxxxxxxx" value="${cfg.token}" />
        
        <div class="toggle-container">
          <label class="toggle-item">
            <span>Remember in this tab</span>
            <input type="checkbox" id="cfg_rem_tab" ${cfg.rememberTab ? 'checked' : ''} onchange="toggleOption('tab')" />
          </label>
          <label class="toggle-item">
            <span>Remember in all tabs</span>
            <input type="checkbox" id="cfg_rem_all" ${cfg.rememberAll ? 'checked' : ''} onchange="toggleOption('all')" />
          </label>
        </div>
      `;

      showModal({
        title: `⚙️ GitHub Setup (${activeTab ? activeTab.name : 'Global'})`,
        message: 'I-enter ang iyong GitHub account at token.',
        customFormHTML: formHTML,
        showCancel: true,
        onConfirm: () => {
          const newCfg = {
            username: document.getElementById('cfg_user').value,
            email: document.getElementById('cfg_email').value,
            repoUrl: document.getElementById('cfg_repo').value,
            token: document.getElementById('cfg_token').value,
            rememberTab: document.getElementById('cfg_rem_tab').checked,
            rememberAll: document.getElementById('cfg_rem_all').checked
          };
          saveGitHubConfig(newCfg, activeTab ? activeTab.id : null);
          showModal({ title: 'Saved!', message: 'Nai-save na ang iyong GitHub Config.' });
          if (onSavedCallback) onSavedCallback();
        }
      });
    }

    function toggleOption(type) {
      const tabCb = document.getElementById('cfg_rem_tab');
      const allCb = document.getElementById('cfg_rem_all');
      if (type === 'tab' && tabCb.checked) {
        allCb.checked = false;
      } else if (type === 'all' && allCb.checked) {
        tabCb.checked = false;
      }
    }

    function getSavedTabList() {
      return JSON.parse(localStorage.getItem('multitab_list_v2') || '[]');
    }

    function saveTabList() {
      const tabDataList = tabs.map(t => ({ id: t.id, name: t.name }));
      localStorage.setItem('multitab_list_v2', JSON.stringify(tabDataList));
      localStorage.setItem('multitab_activeId', activeTabId);
    }

    async function initFS() {
      try { await pfs.mkdir('/home'); } catch (e) {}

      const savedTabs = getSavedTabList();
      if (savedTabs.length > 0) {
        savedTabs.forEach(t => createTabInstance(t.id, t.name));
        const savedActive = localStorage.getItem('multitab_activeId');
        switchTab(savedActive && savedTabs.some(t => t.id === savedActive) ? savedActive : savedTabs[0].id);
      } else {
        addNewTab();
      }
    }

    function updateViewportHeight() {
      const appContainer = document.getElementById('app-container');
      if (window.visualViewport) {
        appContainer.style.height = `${window.visualViewport.height}px`;
        appContainer.style.top = `${window.visualViewport.offsetTop}px`;
      } else {
        appContainer.style.height = `${window.innerHeight}px`;
      }
      tabs.forEach(t => {
        t.fitAddon.fit();
        t.term.scrollToBottom();
      });
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', updateViewportHeight);
      window.visualViewport.addEventListener('scroll', updateViewportHeight);
    }
    window.addEventListener('resize', updateViewportHeight);

    function getNextTabName() {
      for (let i = 1; i <= MAX_TABS; i++) {
        const expectedName = `Tab_${i}`;
        if (!tabs.some(t => t.name === expectedName)) {
          return expectedName;
        }
      }
      return `Tab_${tabs.length + 1}`;
    }

    function createTabInstance(tabId, customName = null) {
      const termContainer = document.getElementById('terminal-container');
      const wrapper = document.createElement('div');
      wrapper.className = 'term-wrapper';
      wrapper.id = `wrapper-${tabId}`;
      termContainer.appendChild(wrapper);

      const term = new Terminal({
        cursorBlink: true,
        theme: { background: '#000000', foreground: '#00ff66' }
      });
      const fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);
      term.open(wrapper);

      const tabName = customName || getNextTabName();

      const tabData = {
        id: tabId,
        name: tabName,
        term,
        fitAddon,
        wrapper,
        currentDir: localStorage.getItem(`tab_${tabId}_currentDir`) || '/home',
        currentInput: '',
        isProcessing: false,
        commandHistory: JSON.parse(localStorage.getItem(`tab_${tabId}_commandHistory`) || '[]'),
        historyIndex: -1,
        undoStack: [],
        redoStack: []
      };

      tabs.push(tabData);

      term.onData(async (e) => {
        if (activeTabId !== tabId) return;
        if (tabData.isProcessing) return;

        switch (e) {
          case '\r':
          case '\n':
            await handleEnter();
            break;
          case '\u007F':
          case '\b':
            if (tabData.currentInput.length > 0) {
              tabData.undoStack.push(tabData.currentInput);
              tabData.redoStack.length = 0;
              tabData.currentInput = tabData.currentInput.slice(0, -1);
              term.write('\b \b');
            }
            break;
          case '\u001b[A':
            handleArrowUp();
            break;
          case '\u001b[B':
            handleArrowDown();
            break;
          default:
            if (e.length === 1 && e >= ' ' && e <= '~') {
              tabData.undoStack.push(tabData.currentInput);
              tabData.redoStack.length = 0;
              tabData.currentInput += e;
              term.write(e);
            }
        }
      });

      const savedBuffer = localStorage.getItem(`tab_${tabId}_bufferText`);
      if (savedBuffer) {
        term.write(savedBuffer.replace(/\n/g, '\r\n'));
        promptForTab(tabData);
      } else {
        term.write(`\x1b[1;32mJepongDevxyz TerMax \r\n(${tabData.name})\x1b[0m\r\n`);
        term.write('Type \x1b[1;33mhelp\x1b[0m for Commands\r\n');
        promptForTab(tabData);
      }

      renderTabsHeader();
      saveTabList();
    }

    function getActiveTab() {
      return tabs.find(t => t.id === activeTabId);
    }

    function promptForTab(t) {
      t.term.write(`\r\n\x1b[1;32mJepongDevxyz@termax\x1b[0m:\x1b[1;34m${t.currentDir}\x1b[0m$ `);
      saveTabState(t);
    }

    function saveTabState(t) {
      localStorage.setItem(`tab_${t.id}_currentDir`, t.currentDir);
      localStorage.setItem(`tab_${t.id}_commandHistory`, JSON.stringify(t.commandHistory));
      
      t.term.selectAll();
      const text = t.term.getSelection();
      t.term.clearSelection();
      localStorage.setItem(`tab_${t.id}_bufferText`, text);
    }

    function addNewTab() {
      if (tabs.length >= MAX_TABS) {
        showModal({ title: 'Tab Limit Reached', message: `Naka-reach ka na sa maximum limit na ${MAX_TABS} tabs!` });
        return;
      }
      const newId = `id_${Date.now().toString().slice(-6)}`;
      createTabInstance(newId);
      switchTab(newId);
    }

    function switchTab(tabId) {
      activeTabId = tabId;
      tabs.forEach(t => {
        if (t.id === tabId) {
          t.wrapper.classList.add('active');
          t.fitAddon.fit();
          t.term.focus();
        } else {
          t.wrapper.classList.remove('active');
        }
      });
      renderTabsHeader();
      saveTabList();
    }

    function closeTab(e, tabId) {
      if (e) e.stopPropagation();
      if (tabs.length === 1) {
        showModal({ title: 'Cannot Close', message: 'Hindi mo pwedeng isara ang huling tab.' });
        return;
      }

      const index = tabs.findIndex(t => t.id === tabId);
      if (index !== -1) {
        const t = tabs[index];
        t.wrapper.remove();
        localStorage.removeItem(`tab_${tabId}_currentDir`);
        localStorage.removeItem(`tab_${tabId}_commandHistory`);
        localStorage.removeItem(`tab_${tabId}_bufferText`);
        sessionStorage.removeItem(`gh_config_tab_${tabId}`);
        
        tabs.splice(index, 1);

        if (activeTabId === tabId) {
          const nextTab = tabs[Math.max(0, index - 1)];
          switchTab(nextTab.id);
        } else {
          renderTabsHeader();
          saveTabList();
        }
      }
    }

    function confirmCloseAllTabs() {
      showModal({
        title: 'Close All Tabs',
        message: 'Sigurado ka bang gusto mong isara ang lahat ng tabs?',
        showCancel: true,
        onConfirm: () => {
          [...tabs].forEach(t => {
            t.wrapper.remove();
            localStorage.removeItem(`tab_${t.id}_currentDir`);
            localStorage.removeItem(`tab_${t.id}_commandHistory`);
            localStorage.removeItem(`tab_${t.id}_bufferText`);
            sessionStorage.removeItem(`gh_config_tab_${t.id}`);
          });
          tabs = [];
          addNewTab();
        }
      });
    }

    function openRenameModal(tab) {
      const formHTML = `<label class="input-label">Tab Name:</label><input type="text" id="rename_input" class="modal-input" value="${tab.name}" />`;
      showModal({
        title: 'Rename Tab',
        message: 'Maglagay ng bagong pangalan para sa tab:',
        customFormHTML: formHTML,
        showCancel: true,
        onConfirm: () => {
          const newName = document.getElementById('rename_input').value;
          if (newName && newName.trim()) {
            tab.name = newName.trim();
            renderTabsHeader();
            saveTabList();
          }
        }
      });
    }

    function renderTabsHeader() {
      const tabsBar = document.getElementById('tabsBar');
      tabsBar.querySelectorAll('.tab-item').forEach(el => el.remove());
      const actionsEl = tabsBar.querySelector('.tab-actions');

      tabs.forEach(t => {
        const tabEl = document.createElement('div');
        tabEl.className = `tab-item ${t.id === activeTabId ? 'active' : ''}`;
        tabEl.onclick = () => switchTab(t.id);

        const label = document.createElement('span');
        label.innerText = t.name;

        const closeBtn = document.createElement('span');
        closeBtn.className = 'tab-close';
        closeBtn.innerHTML = '✕';
        closeBtn.onclick = (e) => {
          e.stopPropagation();
          closeTab(e, t.id);
        };

        tabEl.appendChild(label);
        tabEl.appendChild(closeBtn);
        tabsBar.insertBefore(tabEl, actionsEl);
      });
    }

    function resetAllTabs() {
      showModal({
        title: 'Reset All Data',
        message: 'Gusto mo bang burahin ang lahat ng na-save na tabs at terminal history?',
        showCancel: true,
        onConfirm: () => {
          localStorage.clear();
          sessionStorage.clear();
          location.reload();
        }
      });
    }

    async function getAllFiles(dir, baseDir = dir) {
      let results = [];
      const list = await pfs.readdir(dir);
      for (const file of list) {
        if (file === '.git') continue;
        const fullPath = `${dir}/${file}`;
        const relativePath = fullPath.replace(`${baseDir}/`, '').replace(/^\//, '');
        const stat = await pfs.stat(fullPath);
        if (stat.isDirectory()) {
          const res = await getAllFiles(fullPath, baseDir);
          results = results.concat(res);
        } else {
          results.push(relativePath);
        }
      }
      return results;
    }

    function clearCurrentInputLine() {
      const active = getActiveTab();
      if (!active) return;
      while (active.currentInput.length > 0) {
        active.currentInput = active.currentInput.slice(0, -1);
        active.term.write('\b \b');
      }
    }

    function setInput(text) {
      clearCurrentInputLine();
      const active = getActiveTab();
      if (!active) return;
      active.currentInput = text;
      active.term.write(text);
    }

    async function typeAndExecute(commandText) {
      clearCurrentInputLine();
      const active = getActiveTab();
      if (!active) return;

      for (let char of commandText) {
        active.currentInput += char;
        active.term.write(char);
        await new Promise(r => setTimeout(r, 20));
      }
      await new Promise(r => setTimeout(r, 150));
      await handleEnter();
    }

    async function runAutoWorkflow() {
      const active = getActiveTab();
      const cfg = getSavedGitHubConfig(active ? active.id : null);

      if (!cfg.token || !cfg.repoUrl) {
        showModal({
          title: 'GitHub Credentials Required',
          message: 'Kailangan mo munang i-setup ang iyong GitHub Repository at Token.',
          onConfirm: () => { openConfigModal(() => runAutoWorkflow()); }
        });
        return;
      }

      const repoName = cfg.repoUrl.split('/').pop().replace('.git', '');
      await typeAndExecute(`git clone ${cfg.repoUrl}`);
      await typeAndExecute(`cd ${repoName}`);
      await typeAndExecute(`git add .`);
      await typeAndExecute(`git commit -m "Auto push test via Web TermMax"`);
      await typeAndExecute(`git push`);
    }

    async function handlePaste() {
      const active = getActiveTab();
      if (!active) return;
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          active.currentInput += text;
          active.term.write(text);
        }
      } catch (err) {}
    }

    function handleArrowUp() {
      const active = getActiveTab();
      if (!active) return;
      if (active.commandHistory.length > 0 && active.historyIndex < active.commandHistory.length - 1) {
        active.historyIndex++;
        const prevCmd = active.commandHistory[active.commandHistory.length - 1 - active.historyIndex];
        setInput(prevCmd);
      }
    }

    function handleArrowDown() {
      const active = getActiveTab();
      if (!active) return;
      if (active.historyIndex > 0) {
        active.historyIndex--;
        const nextCmd = active.commandHistory[active.commandHistory.length - 1 - active.historyIndex];
        setInput(nextCmd);
      } else if (active.historyIndex === 0) {
        active.historyIndex = -1;
        clearCurrentInputLine();
      }
    }

    async function handleEnter() {
      const active = getActiveTab();
      if (!active || active.isProcessing) return;

      active.isProcessing = true;
      active.term.write('\r\n');
      const rawInput = active.currentInput.trim();
      if (rawInput) {
        active.commandHistory.push(rawInput);
        active.historyIndex = -1;
      }
      
      const commands = rawInput.split(/&&|;/).map(cmd => cmd.trim()).filter(Boolean);
      active.currentInput = '';

      for (let i = 0; i < commands.length; i++) {
        await handleCommand(commands[i], active);
      }
      
      promptForTab(active);
      active.term.scrollToBottom();
      active.isProcessing = false;
    }

    function handleUndo() {
      const active = getActiveTab();
      if (!active || active.undoStack.length === 0) return;
      active.redoStack.push(active.currentInput);
      setInput(active.undoStack.pop());
    }

    function handleRedo() {
      const active = getActiveTab();
      if (!active || active.redoStack.length === 0) return;
      active.undoStack.push(active.currentInput);
      setInput(active.redoStack.pop());
    }

    async function handleCommand(cmdStr, active) {
      if (!cmdStr) return;
      const term = active.term;
      const cfg = getSavedGitHubConfig(active.id);

      const args = cmdStr.match(/(?:[^\s"]+|"[^"]*")+/g) || [];
      if (args.length === 0) return;

      const cmd = args[0];
      const cleanArgs = args.slice(1).map(arg => arg.replace(/^"|"$/g, ''));

      switch (cmd) {
        case 'help':
          term.write('Commands: ls, cd, mkdir, rm, cat, echo, clear, git clone/init/add/commit/push/pull\r\n');
          break;

        case 'echo':
          const fullText = cleanArgs.join(' ');
          const redirectIndex = fullText.indexOf('>');
          if (redirectIndex !== -1) {
            const textToWrite = fullText.slice(0, redirectIndex).trim();
            const fileName = fullText.slice(redirectIndex + 1).trim();
            if (fileName) {
              await pfs.writeFile(`${active.currentDir}/${fileName}`, textToWrite);
              term.write(`Saved to ${fileName}\r\n`);
            }
          } else {
            term.write(fullText + '\r\n');
          }
          break;

        case 'clear':
          term.clear();
          saveTabState(active);
          break;

        case 'ls':
          try {
            const files = await pfs.readdir(active.currentDir);
            term.write(files.join('  ') + '\r\n');
          } catch (err) {
            term.write(`ls: error reading directory\r\n`);
          }
          break;

        case 'mkdir':
          if (!cleanArgs[0]) return term.write('mkdir: missing operand\r\n');
          try {
            await pfs.mkdir(`${active.currentDir}/${cleanArgs[0]}`);
            term.write(`Directory created.\r\n`);
          } catch (e) {
            term.write(`mkdir: cannot create directory\r\n`);
          }
          break;

        case 'rm':
          if (!cleanArgs[0]) return term.write('rm: missing operand\r\n');
          try {
            const targetName = cleanArgs.filter(arg => arg !== '-rf' && arg !== '-r' && arg !== '-f')[0];
            if (!targetName) return term.write('rm: missing target file or directory\r\n');
            
            const targetPath = `${active.currentDir}/${targetName}`;
            const stat = await pfs.stat(targetPath);
            
            if (stat.isDirectory()) {
              async function removeRecursive(dirPath) {
                const entries = await pfs.readdir(dirPath);
                for (const entry of entries) {
                  const full = `${dirPath}/${entry}`;
                  const s = await pfs.stat(full);
                  if (s.isDirectory()) {
                    await removeRecursive(full);
                  } else {
                    await pfs.unlink(full);
                  }
                }
                await pfs.rmdir(dirPath);
              }
              await removeRecursive(targetPath);
            } else {
              await pfs.unlink(targetPath);
            }
            term.write(`Removed successfully.\r\n`);
          } catch (e) {
            term.write(`rm: cannot remove: No such file or directory\r\n`);
          }
          break;

        case 'cd':
          if (!cleanArgs[0] || cleanArgs[0] === '~') {
            active.currentDir = '/home';
          } else if (cleanArgs[0] === '..') {
            const parts = active.currentDir.split('/').filter(Boolean);
            parts.pop();
            active.currentDir = '/' + parts.join('/');
            if (active.currentDir === '') active.currentDir = '/home';
          } else {
            const target = cleanArgs[0].startsWith('/') ? cleanArgs[0] : `${active.currentDir}/${cleanArgs[0]}`;
            try {
              const stat = await pfs.stat(target);
              if (stat.isDirectory()) active.currentDir = target;
              else term.write(`cd: not a directory\r\n`);
            } catch (e) {
              term.write(`cd: no such file or directory\r\n`);
            }
          }
          break;

        case 'git':
          const subCmd = cleanArgs[0];

          if (subCmd === 'init') {
            try {
              await git.init({ fs, dir: active.currentDir, defaultBranch: 'main' });
              term.write(`[+] Initialized empty Git repository\r\n`);
            } catch (err) {
              term.write(`[!] Error: ${err.message}\r\n`);
            }

          } else if (subCmd === 'clone') {
            if (!cleanArgs[1]) return term.write('Usage: git clone <url>\r\n');
            let repoUrl = cleanArgs[1];
            const repoName = repoUrl.split('/').pop().replace('.git', '');
            const dirPath = active.currentDir === '/' ? `/${repoName}` : `${active.currentDir}/${repoName}`;

            term.write(`Cloning into '${repoName}'...\r\n`);
            try {
              await git.clone({
                fs,
                http,
                dir: dirPath,
                url: repoUrl,
                corsProxy: 'https://cors.isomorphic-git.org',
                noCheckout: false
              });
              term.write(`[+] Clone completed successfully!\r\n`);
            } catch (err) {
              term.write(`[!] Clone Error: ${err.message}\r\n`);
            }

          } else if (subCmd === 'status') {
            try {
              const statusMatrix = await git.statusMatrix({ fs, dir: active.currentDir });
              if (!statusMatrix.length) term.write('working tree clean\r\n');
              for (const [filepath, head, worktree, stage] of statusMatrix) {
                term.write(`  file: ${filepath}\r\n`);
              }
            } catch (err) {
              term.write(`[!] Status Error: ${err.message}\r\n`);
            }

          } else if (subCmd === 'add') {
            try {
              const filesToStaged = await getAllFiles(active.currentDir);
              for (const filepath of filesToStaged) {
                await git.add({ fs, dir: active.currentDir, filepath });
              }
              term.write(`[+] Staged changes successfully.\r\n`);
            } catch (err) {
              term.write(`[!] Add Error: ${err.message}\r\n`);
            }

          } else if (subCmd === 'commit') {
            const flagIndex = cleanArgs.indexOf('-m');
            const message = flagIndex !== -1 ? cleanArgs[flagIndex + 1] : 'Update via Web TermMax';
            try {
              let sha = await git.commit({
                fs,
                dir: active.currentDir,
                author: { name: cfg.username || 'User', email: cfg.email || 'user@webterm.com' },
                message: message
              });
              term.write(`[+] Commit created: ${sha.slice(0, 7)}\r\n`);
            } catch (err) {
              term.write(`[!] Commit Error: ${err.message}\r\n`);
            }

          } else if (subCmd === 'push') {
            if (!cfg.token) {
              term.write(`[!] Push cancelled: GitHub PAT required. Click ⚙️ Setup.\r\n`);
              openConfigModal();
              return;
            }

            term.write(`Pushing changes to remote repository...\r\n`);
            try {
              await git.push({
                fs,
                http,
                dir: active.currentDir,
                corsProxy: 'https://cors.isomorphic-git.org',
                onAuth: () => ({ username: cfg.token, password: '' })
              });

              let ghUser = cfg.username;
              let repoName = '';
              if (cfg.repoUrl) {
                const cleanUrl = cfg.repoUrl.replace(/\.git$/, '');
                const parts = cleanUrl.split('/');
                repoName = parts.pop();
                if (!ghUser) {
                  ghUser = parts.pop();
                }
              }

              term.write(`\x1b[1;32m[+] Push successful!\x1b[0m\r\n`);
              if (ghUser && repoName) {
                const liveUrl = `https://${ghUser}.github.io/${repoName}/`;
                term.write(`\x1b[1;36m🌐 Live Website Link: ${liveUrl}\x1b[0m\r\n`);
              }
            } catch (err) {
              term.write(`\x1b[1;31m[!] Git Push Error: ${err.message}\x1b[0m\r\n`);
            }
          }
          break;

        default:
          term.write(`${cmd}: command not found.\r\n`);
      }
    }

    initFS();
  </script>
</body>
