<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JepongDevxyz TerMax</title>

  <!-- Step 1: Buffer Polyfill -->
  <script src="https://cdn.jsdelivr.net/npm/buffer@6.0.3/index.min.js"></script>
  <script>
    window.Buffer = window.buffer.Buffer;
    if (!window.Buffer.isBuffer) {
      window.Buffer.isBuffer = function(b) {
        return !!(b && b._isBuffer);
      };
    }
  </script>

  <!-- Step 2: External Libraries -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <script src="https://unpkg.com/@isomorphic-git/lightning-fs"></script>
  <script src="https://unpkg.com/isomorphic-git@1.25.0/index.umd.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      background-color: #000;
      color: #00ff66;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: monospace;
    }
    
    #app-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Tab Bar Styling */
    .tabs-bar {
      display: flex;
      align-items: center;
      background-color: #111;
      border-bottom: 1px solid #333;
      overflow-x: auto;
      white-space: nowrap;
      flex-shrink: 0;
      height: 42px;
      padding: 0 4px;
    }

    .tab-item {
      background-color: #1e1e1e;
      color: #888;
      border: 1px solid #333;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      padding: 6px 12px;
      font-size: 12px;
      margin-right: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      user-select: none;
      transition: background-color 0.2s, color 0.2s;
    }

    .tab-item.active {
      background-color: #000;
      color: #00ff66;
      border-color: #00ff66;
      font-weight: bold;
    }

    .tab-close {
      color: #ff5555;
      font-weight: bold;
      font-size: 11px;
      border-radius: 50%;
      padding: 0 4px;
    }
    .tab-close:hover {
      background-color: #ff5555;
      color: #000;
    }

    .tab-actions {
      display: flex;
      gap: 4px;
      margin-left: 4px;
      flex-shrink: 0;
    }

    .add-tab-btn, .close-all-btn, .config-btn {
      border: none;
      border-radius: 4px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }

    .add-tab-btn {
      background-color: #00ff66;
      color: #000;
    }

    .close-all-btn {
      background-color: #2a1111;
      color: #ff5555;
      border: 1px solid #ff5555;
    }

    .config-btn {
      background-color: #222;
      color: #00ff66;
      border: 1px solid #00ff66;
    }

    #terminal-container {
      flex: 1;
      width: 100%;
      padding: 5px;
      overflow: hidden;
      position: relative;
    }

    .term-wrapper {
      width: 100%;
      height: 100%;
      display: none;
    }
    .term-wrapper.active {
      display: block;
    }
    
    /* Touch Controls */
    .termux-toolbar {
      height: 48px;
      width: 100%;
      display: flex;
      align-items: center;
      background-color: #1a1a1a;
      border-top: 2px solid #00ff66;
      padding: 0 8px;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      z-index: 9999;
      user-select: none;
      -webkit-user-select: none;
      flex-shrink: 0;
    }

    .termux-btn {
      background-color: #2a2a2a;
      color: #00ff66;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: bold;
      font-family: monospace;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      flex-shrink: 0;
    }
    .termux-btn.auto-btn {
      background-color: #00ff66;
      color: #000;
      border: 1px solid #00ff66;
    }
    .termux-btn:active {
      background-color: #00ff66;
      color: #000;
    }

    /* Modern Notification & Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-card {
      background: #141414;
      border: 1px solid #00ff66;
      border-radius: 12px;
      width: 90%;
      max-width: 380px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,255,102,0.15);
      transform: scale(0.9);
      transition: transform 0.25s ease;
      color: #fff;
    }
    .modal-overlay.active .modal-card {
      transform: scale(1);
    }
    .modal-title {
      font-size: 16px;
      font-weight: bold;
      color: #00ff66;
      margin-bottom: 10px;
    }
    .modal-body {
      font-size: 13px;
      color: #ccc;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .input-label {
      font-size: 11px;
      color: #00ff66;
      margin-top: 8px;
      display: block;
    }
    .modal-input {
      width: 100%;
      background: #000;
      border: 1px solid #333;
      border-radius: 6px;
      color: #00ff66;
      padding: 8px 10px;
      font-family: monospace;
      outline: none;
      margin-top: 4px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .modal-input:focus {
      border-color: #00ff66;
    }
    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 12px;
    }
    .modal-btn {
      background: #222;
      border: 1px solid #444;
      color: #fff;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: bold;
    }
    .modal-btn.primary {
      background: #00ff66;
      color: #000;
      border: none;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <!-- Top Multi-Tab Bar -->
    <div class="tabs-bar" id="tabsBar">
      <div class="tab-actions">
        <button class="add-tab-btn" onclick="addNewTab()" title="New Tab (Max 12)">+ New Tab</button>
        <button class="config-btn" onclick="openConfigModal()" title="GitHub Configuration">⚙️ Setup</button>
        <button class="close-all-btn" onclick="confirmCloseAllTabs()" title="Close All Tabs">✕ Close All</button>
      </div>
    </div>

    <!-- Terminal Container -->
    <div id="terminal-container"></div>

    <!-- Touch Control Bar -->
    <div class="termux-toolbar">
      <button class="termux-btn auto-btn" onclick="runAutoWorkflow()">⚡ Auto Push Test</button>
      <button class="termux-btn" onclick="handlePaste()">Paste</button>
      <button class="termux-btn" onclick="handleArrowUp()">↑</button>
      <button class="termux-btn" onclick="handleArrowDown()">↓</button>
      <button class="termux-btn" onclick="handleEnter()">Enter ↩</button>
      <button class="termux-btn" onclick="handleUndo()">Undo</button>
      <button class="termux-btn" onclick="handleRedo()">Redo</button>
      <button class="termux-btn" onclick="resetAllTabs()" style="color: #ff5555; border-color: #ff5555;">Clear Saved</button>
    </div>
  </div>

  <!-- Custom Universal Modal -->
  <div class="modal-overlay" id="customModal">
    <div class="modal-card">
      <div class="modal-title" id="modalTitle">Notification</div>
      <div class="modal-body" id="modalBody">Message text goes here...</div>
      <div id="modalCustomForm" style="display: none;"></div>
      <div class="modal-buttons" id="modalButtons">
        <button class="modal-btn primary" id="modalConfirmBtn">OK</button>
      </div>
    </div>
  </div>

  <script>
    const MAX_TABS = 12;
    const fs = new LightningFS('JepongFS');
    const pfs = fs.promises;

    const http = {
      async request({ url, method, headers, body }) {
        let reqBody = body;
        if (body && typeof body[Symbol.asyncIterator] === 'function') {
          const chunks = [];
          for await (const chunk of body) chunks.push(chunk);
          reqBody = Buffer.concat(chunks);
        }

        const res = await fetch(url, { method, headers, body: reqBody });

        return {
          url: res.url,
          method: method,
          statusCode: res.status,
          statusMessage: res.statusText,
          headers: Object.fromEntries(res.headers.entries()),
          body: (async function* () {
            const reader = res.body.getReader();
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              yield value;
            }
          })()
        };
      }
    };

    // Global state
    let tabs = [];
    let activeTabId = null;

    /* --- GitHub User Settings Helper --- */
    function getSavedGitHubConfig() {
      return {
        username: localStorage.getItem('gh_username') || '',
        email: localStorage.getItem('gh_email') || '',
        repoUrl: localStorage.getItem('gh_repourl') || '',
        token: localStorage.getItem('gh_token') || ''
      };
    }

    function saveGitHubConfig(cfg) {
      if (cfg.username) localStorage.setItem('gh_username', cfg.username.trim());
      if (cfg.email) localStorage.setItem('gh_email', cfg.email.trim());
      if (cfg.repoUrl) localStorage.setItem('gh_repourl', cfg.repoUrl.trim());
      if (cfg.token) localStorage.setItem('gh_token', cfg.token.trim());
    }

    /* --- Modern Modal System --- */
    function showModal({ title, message, customFormHTML = null, showCancel = false, onConfirm }) {
      const modal = document.getElementById('customModal');
      const titleEl = document.getElementById('modalTitle');
      const bodyEl = document.getElementById('modalBody');
      const customFormEl = document.getElementById('modalCustomForm');
      const buttonsEl = document.getElementById('modalButtons');

      titleEl.innerText = title || 'Notice';
      bodyEl.innerText = message || '';
      
      if (customFormHTML) {
        customFormEl.innerHTML = customFormHTML;
        customFormEl.style.display = 'block';
      } else {
        customFormEl.innerHTML = '';
        customFormEl.style.display = 'none';
      }

      buttonsEl.innerHTML = '';
      if (showCancel) {
        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'modal-btn';
        cancelBtn.innerText = 'Cancel';
        cancelBtn.onclick = () => closeModal();
        buttonsEl.appendChild(cancelBtn);
      }

      const confirmBtn = document.createElement('button');
      confirmBtn.className = 'modal-btn primary';
      confirmBtn.innerText = 'OK';
      confirmBtn.onclick = () => {
        closeModal();
        if (onConfirm) onConfirm();
      };
      buttonsEl.appendChild(confirmBtn);

      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('customModal').classList.remove('active');
    }

    /* GitHub Setup Modal */
    function openConfigModal(onSavedCallback = null) {
      const cfg = getSavedGitHubConfig();
      const formHTML = `
        <label class="input-label">GitHub Username:</label>
        <input type="text" id="cfg_user" class="modal-input" placeholder="e.g. JepongDevxyz" value="${cfg.username}" />
        <label class="input-label">GitHub Email:</label>
        <input type="text" id="cfg_email" class="modal-input" placeholder="e.g. user@gmail.com" value="${cfg.email}" />
        <label class="input-label">Target Repository URL:</label>
        <input type="text" id="cfg_repo" class="modal-input" placeholder="https://github.com/user/repo.git" value="${cfg.repoUrl}" />
        <label class="input-label">Personal Access Token (PAT):</label>
        <input type="password" id="cfg_token" class="modal-input" placeholder="ghp_xxxxxxxxxxxx" value="${cfg.token}" />
      `;

      showModal({
        title: '⚙️ GitHub Setup',
        message: 'I-enter ang iyong sariling GitHub account at token para sa Auto Push:',
        customFormHTML: formHTML,
        showCancel: true,
        onConfirm: () => {
          const newCfg = {
            username: document.getElementById('cfg_user').value,
            email: document.getElementById('cfg_email').value,
            repoUrl: document.getElementById('cfg_repo').value,
            token: document.getElementById('cfg_token').value
          };
          saveGitHubConfig(newCfg);
          showModal({ title: 'Saved!', message: 'Nai-save na ang iyong GitHub Config.' });
          if (onSavedCallback) onSavedCallback();
        }
      });
    }

    function getSavedTabList() {
      return JSON.parse(localStorage.getItem('multitab_list_v2') || '[]');
    }

    function saveTabList() {
      const tabDataList = tabs.map(t => ({ id: t.id, name: t.name }));
      localStorage.setItem('multitab_list_v2', JSON.stringify(tabDataList));
      localStorage.setItem('multitab_activeId', activeTabId);
    }

    async function initFS() {
      try { await pfs.mkdir('/home'); } catch (e) {}

      const savedTabs = getSavedTabList();
      if (savedTabs.length > 0) {
        savedTabs.forEach(t => createTabInstance(t.id, t.name));
        const savedActive = localStorage.getItem('multitab_activeId');
        switchTab(savedActive && savedTabs.some(t => t.id === savedActive) ? savedActive : savedTabs[0].id);
      } else {
        addNewTab();
      }
    }

    function updateViewportHeight() {
      const appContainer = document.getElementById('app-container');
      if (window.visualViewport) {
        appContainer.style.height = `${window.visualViewport.height}px`;
        appContainer.style.top = `${window.visualViewport.offsetTop}px`;
      } else {
        appContainer.style.height = `${window.innerHeight}px`;
      }
      tabs.forEach(t => {
        t.fitAddon.fit();
        t.term.scrollToBottom();
      });
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', updateViewportHeight);
      window.visualViewport.addEventListener('scroll', updateViewportHeight);
    }
    window.addEventListener('resize', updateViewportHeight);

    function getNextTabName() {
      for (let i = 1; i <= MAX_TABS; i++) {
        const expectedName = `Tab_${i}`;
        if (!tabs.some(t => t.name === expectedName)) {
          return expectedName;
        }
      }
      return `Tab_${tabs.length + 1}`;
    }

    function createTabInstance(tabId, customName = null) {
      const termContainer = document.getElementById('terminal-container');
      const wrapper = document.createElement('div');
      wrapper.className = 'term-wrapper';
      wrapper.id = `wrapper-${tabId}`;
      termContainer.appendChild(wrapper);

      const term = new Terminal({
        cursorBlink: true,
        theme: { background: '#000000', foreground: '#00ff66' }
      });
      const fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);
      term.open(wrapper);

      const tabName = customName || getNextTabName();

      const tabData = {
        id: tabId,
        name: tabName,
        term,
        fitAddon,
        wrapper,
        currentDir: localStorage.getItem(`tab_${tabId}_currentDir`) || '/home',
        currentInput: '',
        commandHistory: JSON.parse(localStorage.getItem(`tab_${tabId}_commandHistory`) || '[]'),
        historyIndex: -1,
        undoStack: [],
        redoStack: []
      };

      tabs.push(tabData);

      term.onData(async (e) => {
        if (activeTabId !== tabId) return;
        switch (e) {
          case '\r':
            await handleEnter();
            break;
          case '\u007F':
            if (tabData.currentInput.length > 0) {
              tabData.undoStack.push(tabData.currentInput);
              tabData.redoStack.length = 0;
              tabData.currentInput = tabData.currentInput.slice(0, -1);
              term.write('\b \b');
            }
            break;
          case '\u001b[A':
            handleArrowUp();
            break;
          case '\u001b[B':
            handleArrowDown();
            break;
          default:
            if (e >= ' ' && e <= '~') {
              tabData.undoStack.push(tabData.currentInput);
              tabData.redoStack.length = 0;
              tabData.currentInput += e;
              term.write(e);
            }
        }
      });

      const savedBuffer = localStorage.getItem(`tab_${tabId}_bufferText`);
      if (savedBuffer) {
        term.write(savedBuffer.replace(/\n/g, '\r\n'));
        promptForTab(tabData);
      } else {
        term.write(`\x1b[1;32mJepongDevxyz Web TermMax (${tabData.name})\x1b[0m\r\n`);
        term.write('Press \x1b[1;33m[⚡ Auto Push Test]\x1b[0m or type \x1b[1;33mhelp\x1b[0m.\r\n');
        promptForTab(tabData);
      }

      renderTabsHeader();
      saveTabList();
    }

    function getActiveTab() {
      return tabs.find(t => t.id === activeTabId);
    }

    function promptForTab(t) {
      t.term.write(`\r\n\x1b[1;32mJepongDevxyz@termax\x1b[0m:\x1b[1;34m${t.currentDir}\x1b[0m$ `);
      saveTabState(t);
    }

    function saveTabState(t) {
      localStorage.setItem(`tab_${t.id}_currentDir`, t.currentDir);
      localStorage.setItem(`tab_${t.id}_commandHistory`, JSON.stringify(t.commandHistory));
      
      t.term.selectAll();
      const text = t.term.getSelection();
      t.term.clearSelection();
      localStorage.setItem(`tab_${t.id}_bufferText`, text);
    }

    function addNewTab() {
      if (tabs.length >= MAX_TABS) {
        showModal({
          title: 'Tab Limit Reached',
          message: `Naka-reach ka na sa maximum limit na ${MAX_TABS} tabs!`
        });
        return;
      }
      const newId = `id_${Date.now().toString().slice(-6)}`;
      createTabInstance(newId);
      switchTab(newId);
    }

    function switchTab(tabId) {
      activeTabId = tabId;
      tabs.forEach(t => {
        if (t.id === tabId) {
          t.wrapper.classList.add('active');
          t.fitAddon.fit();
          t.term.focus();
        } else {
          t.wrapper.classList.remove('active');
        }
      });
      renderTabsHeader();
      saveTabList();
    }

    function closeTab(e, tabId) {
      if (e) e.stopPropagation();
      if (tabs.length === 1) {
        showModal({
          title: 'Cannot Close',
          message: 'Hindi mo pwedeng isara ang natitirang huling tab.'
        });
        return;
      }

      const index = tabs.findIndex(t => t.id === tabId);
      if (index !== -1) {
        const t = tabs[index];
        t.wrapper.remove();
        localStorage.removeItem(`tab_${tabId}_currentDir`);
        localStorage.removeItem(`tab_${tabId}_commandHistory`);
        localStorage.removeItem(`tab_${tabId}_bufferText`);
        
        tabs.splice(index, 1);

        if (activeTabId === tabId) {
          const nextTab = tabs[Math.max(0, index - 1)];
          switchTab(nextTab.id);
        } else {
          renderTabsHeader();
          saveTabList();
        }
      }
    }

    function confirmCloseAllTabs() {
      showModal({
        title: 'Close All Tabs',
        message: 'Sigurado ka bang gusto mong isara ang lahat ng tabs?',
        showCancel: true,
        onConfirm: () => {
          [...tabs].forEach(t => {
            t.wrapper.remove();
            localStorage.removeItem(`tab_${t.id}_currentDir`);
            localStorage.removeItem(`tab_${t.id}_commandHistory`);
            localStorage.removeItem(`tab_${t.id}_bufferText`);
          });
          tabs = [];
          addNewTab();
        }
      });
    }

    function openRenameModal(tab) {
      const formHTML = `
        <label class="input-label">Tab Name:</label>
        <input type="text" id="rename_input" class="modal-input" value="${tab.name}" />
      `;
      showModal({
        title: 'Rename Tab',
        message: 'Maglagay ng bagong pangalan para sa tab:',
        customFormHTML: formHTML,
        showCancel: true,
        onConfirm: () => {
          const newName = document.getElementById('rename_input').value;
          if (newName && newName.trim()) {
            tab.name = newName.trim();
            renderTabsHeader();
            saveTabList();
          }
        }
      });
    }

    function renderTabsHeader() {
      const tabsBar = document.getElementById('tabsBar');
      tabsBar.querySelectorAll('.tab-item').forEach(el => el.remove());

      const actionsEl = tabsBar.querySelector('.tab-actions');

      tabs.forEach(t => {
        const tabEl = document.createElement('div');
        tabEl.className = `tab-item ${t.id === activeTabId ? 'active' : ''}`;
        
        let pressTimer = null;

        tabEl.onclick = () => switchTab(t.id);

        const startPress = () => {
          pressTimer = setTimeout(() => {
            openRenameModal(t);
          }, 600);
        };
        const cancelPress = () => {
          if (pressTimer) clearTimeout(pressTimer);
        };

        tabEl.addEventListener('touchstart', startPress, { passive: true });
        tabEl.addEventListener('touchend', cancelPress);
        tabEl.addEventListener('touchmove', cancelPress);
        tabEl.addEventListener('mousedown', startPress);
        tabEl.addEventListener('mouseup', cancelPress);
        tabEl.addEventListener('mouseleave', cancelPress);

        tabEl.oncontextmenu = (e) => {
          e.preventDefault();
          openRenameModal(t);
        };

        const label = document.createElement('span');
        label.innerText = t.name;

        const closeBtn = document.createElement('span');
        closeBtn.className = 'tab-close';
        closeBtn.innerHTML = '✕';
        closeBtn.onclick = (e) => {
          e.stopPropagation();
          closeTab(e, t.id);
        };

        tabEl.appendChild(label);
        tabEl.appendChild(closeBtn);

        tabsBar.insertBefore(tabEl, actionsEl);
      });
    }

    function resetAllTabs() {
      showModal({
        title: 'Reset All Data',
        message: 'Gusto mo bang burahin ang lahat ng na-save na tabs at terminal history?',
        showCancel: true,
        onConfirm: () => {
          localStorage.clear();
          location.reload();
        }
      });
    }

    async function getAllFiles(dir, baseDir = dir) {
      let results = [];
      const list = await pfs.readdir(dir);
      for (const file of list) {
        if (file === '.git') continue;
        const fullPath = `${dir}/${file}`;
        const relativePath = fullPath.replace(`${baseDir}/`, '').replace(/^\//, '');
        const stat = await pfs.stat(fullPath);
        if (stat.isDirectory()) {
          const res = await getAllFiles(fullPath, baseDir);
          results = results.concat(res);
        } else {
          results.push(relativePath);
        }
      }
      return results;
    }

    function clearCurrentInputLine() {
      const active = getActiveTab();
      if (!active) return;
      while (active.currentInput.length > 0) {
        active.currentInput = active.currentInput.slice(0, -1);
        active.term.write('\b \b');
      }
    }

    function setInput(text) {
      clearCurrentInputLine();
      const active = getActiveTab();
      if (!active) return;
      active.currentInput = text;
      active.term.write(text);
    }

    async function typeAndExecute(commandText) {
      clearCurrentInputLine();
      const active = getActiveTab();
      if (!active) return;

      for (let char of commandText) {
        active.currentInput += char;
        active.term.write(char);
        await new Promise(r => setTimeout(r, 20));
      }
      await new Promise(r => setTimeout(r, 150));
      await handleEnter();
    }

    async function runAutoWorkflow() {
      const cfg = getSavedGitHubConfig();

      if (!cfg.token || !cfg.repoUrl) {
        showModal({
          title: 'GitHub Credentials Required',
          message: 'Kailangan mo munang i-setup ang iyong GitHub Repository at Token para magamit ang Auto Push.',
          onConfirm: () => {
            openConfigModal(() => runAutoWorkflow());
          }
        });
        return;
      }

      const repoName = cfg.repoUrl.split('/').pop().replace('.git', '');

      await typeAndExecute(`git clone ${cfg.repoUrl}`);
      await typeAndExecute(`cd ${repoName}`);
      await typeAndExecute(`mkdir auto-test-folder`);
      await typeAndExecute(`git add .`);
      await typeAndExecute(`git commit -m "Auto push test via Web TermMax"`);
      await typeAndExecute(`git push`);
    }

    async function handlePaste() {
      const active = getActiveTab();
      if (!active) return;
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          active.undoStack.push(active.currentInput);
          active.redoStack.length = 0;
          active.currentInput += text;
          active.term.write(text);
        }
      } catch (err) {
        const formHTML = `<input type="text" id="paste_text" class="modal-input" placeholder="Paste text here..." />`;
        showModal({
          title: 'Paste Text',
          message: 'I-paste ang teksto sa ibaba:',
          customFormHTML: formHTML,
          showCancel: true,
          onConfirm: () => {
            const val = document.getElementById('paste_text').value;
            if (val) {
              active.undoStack.push(active.currentInput);
              active.redoStack.length = 0;
              active.currentInput += val;
              active.term.write(val);
            }
          }
        });
      }
    }

    function handleArrowUp() {
      const active = getActiveTab();
      if (!active) return;
      if (active.commandHistory.length > 0 && active.historyIndex < active.commandHistory.length - 1) {
        active.historyIndex++;
        const prevCmd = active.commandHistory[active.commandHistory.length - 1 - active.historyIndex];
        setInput(prevCmd);
      }
    }

    function handleArrowDown() {
      const active = getActiveTab();
      if (!active) return;
      if (active.historyIndex > 0) {
        active.historyIndex--;
        const nextCmd = active.commandHistory[active.commandHistory.length - 1 - active.historyIndex];
        setInput(nextCmd);
      } else if (active.historyIndex === 0) {
        active.historyIndex = -1;
        clearCurrentInputLine();
      }
    }

    async function handleEnter() {
      const active = getActiveTab();
      if (!active) return;

      active.term.write('\r\n');
      const rawInput = active.currentInput.trim();
      if (rawInput) {
        active.commandHistory.push(rawInput);
        active.historyIndex = -1;
      }
      
      const commands = rawInput.split(/&&|;/).map(cmd => cmd.trim()).filter(Boolean);
      
      active.currentInput = '';
      active.undoStack.length = 0;
      active.redoStack.length = 0;

      for (let i = 0; i < commands.length; i++) {
        await handleCommand(commands[i], active);
      }
      
      promptForTab(active);
      active.term.scrollToBottom();
    }

    function handleUndo() {
      const active = getActiveTab();
      if (!active) return;
      if (active.undoStack.length > 0) {
        active.redoStack.push(active.currentInput);
        const lastState = active.undoStack.pop();
        setInput(lastState);
      }
    }

    function handleRedo() {
      const active = getActiveTab();
      if (!active) return;
      if (active.redoStack.length > 0) {
        active.undoStack.push(active.currentInput);
        const nextState = active.redoStack.pop();
        setInput(nextState);
      }
    }

    async function handleCommand(cmdStr, active) {
      if (!cmdStr) return;
      const term = active.term;
      const cfg = getSavedGitHubConfig();

      const args = cmdStr.match(/(?:[^\s"]+|"[^"]*")+/g).map(a => a.replace(/^"|"$/g, ''));
      const cmd = args[0];

      switch (cmd) {
        case 'help':
          term.write('\x1b[1;33m=== FILE SYSTEM COMMANDS ===\x1b[0m\r\n');
          term.write('  \x1b[1;36mls\x1b[0m                 - List files in current folder\r\n');
          term.write('  \x1b[1;36mcd <folder>\x1b[0m        - Change directory\r\n');
          term.write('  \x1b[1;36mmkdir <folder>\x1b[0m     - Create directory\r\n');
          term.write('  \x1b[1;36mrm <target> / -rf\x1b[0m  - Delete file or directory\r\n');
          term.write('  \x1b[1;36mcat <file>\x1b[0m         - Read file content\r\n');
          term.write('  \x1b[1;36mclear\x1b[0m              - Clear terminal\r\n\r\n');

          term.write('\x1b[1;33m=== FULL GITHUB COMMANDS ===\x1b[0m\r\n');
          term.write('  \x1b[1;32mgit clone <url>\x1b[0m    - Clone repository\r\n');
          term.write('  \x1b[1;32mgit init\x1b[0m           - Initialize new local Git repository\r\n');
          term.write('  \x1b[1;32mgit status\x1b[0m         - View modified/staged files\r\n');
          term.write('  \x1b[1;32mgit add .\x1b[0m          - Stage all changes\r\n');
          term.write('  \x1b[1;32mgit commit -m "msg"\x1b[0m- Commit staged changes\r\n');
          term.write('  \x1b[1;32mgit push\x1b[0m           - Push commits to GitHub\r\n');
          term.write('  \x1b[1;32mgit pull\x1b[0m           - Fetch and merge latest changes\r\n');
          term.write('  \x1b[1;32mgit log\x1b[0m            - Show commit history\r\n');
          term.write('  \x1b[1;32mgit branch\x1b[0m         - List local branches\r\n');
          term.write('  \x1b[1;32mgit checkout <bname>\x1b[0m- Switch branch\r\n');
          term.write('  \x1b[1;32mgit remote add <u|r>\x1b[0m- Link local repo to remote URL\r\n');
          break;

        case 'clear':
          term.clear();
          saveTabState(active);
          break;

        case 'ls':
          try {
            const files = await pfs.readdir(active.currentDir);
            term.write(files.join('  ') + '\r\n');
          } catch (err) {
            term.write(`ls: error reading directory\r\n`);
          }
          break;

        case 'mkdir':
          if (!args[1]) return term.write('mkdir: missing operand\r\n');
          try {
            await pfs.mkdir(`${active.currentDir}/${args[1]}`);
            term.write(`Directory '${args[1]}' created.\r\n`);
          } catch (err) {
            term.write(`mkdir: cannot create directory\r\n`);
          }
          break;

        case 'rm':
          if (!args[1]) return term.write('rm: missing operand\r\n');
          const targetName = args[1] === '-rf' ? args[2] : args[1];
          if (!targetName) return term.write('rm: missing operand\r\n');
          
          const fullPath = targetName.startsWith('/') ? targetName : `${active.currentDir}/${targetName}`;

          async function removeRecursive(path) {
            try {
              const stat = await pfs.stat(path);
              if (stat.isDirectory()) {
                const files = await pfs.readdir(path);
                for (const file of files) {
                  await removeRecursive(`${path}/${file}`);
                }
                await pfs.rmdir(path);
              } else {
                await pfs.unlink(path);
              }
            } catch (e) {}
          }

          try {
            await removeRecursive(fullPath);
            term.write(`\x1b[1;32m[+] Removed '${targetName}' successfully.\x1b[0m\r\n`);
          } catch (err) {
            term.write(`\x1b[1;31m[!] rm error: ${err.message}\x1b[0m\r\n`);
          }
          break;

        case 'cd':
          if (!args[1] || args[1] === '~') {
            active.currentDir = '/home';
          } else if (args[1] === '..') {
            const parts = active.currentDir.split('/').filter(Boolean);
            parts.pop();
            active.currentDir = '/' + parts.join('/');
            if (active.currentDir === '') active.currentDir = '/home';
          } else {
            const target = args[1].startsWith('/') ? args[1] : `${active.currentDir}/${args[1]}`;
            try {
              const stat = await pfs.stat(target);
              if (stat.isDirectory()) active.currentDir = target;
              else term.write(`cd: ${args[1]}: Not a directory\r\n`);
            } catch (e) {
              term.write(`cd: ${args[1]}: No such file or directory\r\n`);
            }
          }
          break;

        case 'cat':
          if (!args[1]) return term.write('cat: missing file\r\n');
          try {
            const content = await pfs.readFile(`${active.currentDir}/${args[1]}`, 'utf8');
            term.write(content.replace(/\n/g, '\r\n') + '\r\n');
          } catch (e) {
            term.write(`cat: ${args[1]}: No such file\r\n`);
          }
          break;

        case 'git':
          const subCmd = args[1];

          if (subCmd === 'init') {
            try {
              await git.init({ fs, dir: active.currentDir, defaultBranch: 'main' });
              term.write(`\x1b[1;32m[+] Initialized empty Git repository in ${active.currentDir}\x1b[0m\r\n`);
            } catch (err) {
              term.write(`\x1b[1;31m[!] Git Init Error: ${err.message}\x1b[0m\r\n`);
            }

          } else if (subCmd === 'clone') {
            if (!args[2]) return term.write('Usage: git clone <url>\r\n');
            
            let repoUrl = args[2].replace(/^\[|\]\(.*\)$/g, '').replace(/[()]/g, '');
            const repoName = repoUrl.split('/').pop().replace('.git', '');
            const dirPath = active.currentDir === '/' ? `/${repoName}` : `${active.currentDir}/${repoName}`;

            term.write(`\x1b[1;36mCloning into '${repoName}'...\x1b[0m\r\n`);
            try {
              await git.clone({
                fs,
                http,
                dir: dirPath,
                url: repoUrl,
                corsProxy: 'https://cors.isomorphic-git.org',
                noCheckout: false
              });
              term.write(`\x1b[1;32m[+] Clone completed successfully!\x1b[0m\r\n`);
            } catch (err) {
              if (err.message.includes('EEXIST')) {
                term.write(`\x1b[1;33m[!] Folder '${repoName}' already exists. Skipping clone.\x1b[0m\r\n`);
              } else if (err.message.includes('Could not find HEAD') || err.message.includes('Empty response') || err.message.includes('404')) {
                try {
                  try { await pfs.mkdir(dirPath); } catch (e) {}
                  await git.init({ fs, dir: dirPath, defaultBranch: 'main' });
                  await git.addRemote({ fs, dir: dirPath, remote: 'origin', url: repoUrl });
                  term.write(`\x1b[1;32m[+] Initialized workspace & connected to remote repository!\x1b[0m\r\n`);
                } catch (initErr) {
                  term.write(`\x1b[1;31m[!] Git Error: ${initErr.message}\x1b[0m\r\n`);
                }
              } else {
                term.write(`\x1b[1;31m[!] Git Clone Error: ${err.message}\x1b[0m\r\n`);
              }
            }

          } else if (subCmd === 'status') {
            try {
              const statusMatrix = await git.statusMatrix({ fs, dir: active.currentDir });
              if (!statusMatrix.length) {
                term.write('Nothing to commit, working tree clean\r\n');
              } else {
                for (const [filepath, head, worktree, stage] of statusMatrix) {
                  let state = '';
                  if (head === 1 && worktree === 2 && stage === 2) state = '\x1b[1;33mmodified\x1b[0m';
                  else if (head === 0 && worktree === 2 && stage === 0) state = '\x1b[1;31muntracked\x1b[0m';
                  else if (head === 0 && worktree === 2 && stage === 2) state = '\x1b[1;32mstaged\x1b[0m';
                  if (state) term.write(`  ${state}: ${filepath}\r\n`);
                }
              }
            } catch (err) {
              term.write(`\x1b[1;31m[!] Git Status Error: ${err.message}\x1b[0m\r\n`);
            }

          } else if (subCmd === 'add') {
            const fileTarget = args[2] || '.';
            try {
              if (fileTarget === '.') {
                const filesToStaged = await getAllFiles(active.currentDir);
                for (const filepath of filesToStaged) {
                  await git.add({ fs, dir: active.currentDir, filepath });
                }
              } else {
                await git.add({ fs, dir: active.currentDir, filepath: fileTarget });
              }
              term.write(`\x1b[1;32m[+] Staged changes successfully.\x1b[0m\r\n`);
            } catch (err) {
              term.write(`\x1b[1;31m[!] Git Add Error: ${err.message}\x1b[0m\r\n`);
            }

          } else if (subCmd === 'commit') {
            const flagIndex = args.indexOf('-m');
            const message = flagIndex !== -1 ? args[flagIndex + 1] : 'Update via Web TermMax';
            
            try {
              let sha = await git.commit({
                fs,
                dir: active.currentDir,
                author: { 
                  name: cfg.username || 'User', 
                  email: cfg.email || 'user@webterm.com' 
                },
                message: message
              });
              term.write(`\x1b[1;32m[+] Commit created: ${sha.slice(0, 7)}\x1b[0m\r\n`);
            } catch (err) {
              term.write(`\x1b[1;31m[!] Git Commit Error: ${err.message}\x1b[0m\r\n`);
            }

          } else if (subCmd === 'push') {
            if (!cfg.token) {
              term.write(`\x1b[1;31m[!] Push cancelled: GitHub PAT required. Please click ⚙️ Setup.\x1b[0m\r\n`);
              openConfigModal();
              return;
            }

            term.write(`\x1b[1;36mPushing changes to remote repository...\x1b[0m\r\n`);
            try {
              await git.push({
                fs,
                http,
                dir: active.currentDir,
                corsProxy: 'https://cors.isomorphic-git.org',
                onAuth: () => ({ username: cfg.token })
              });
              term.write(`\x1b[1;32m[+] Push successful!\x1b[0m\r\n`);
            } catch (err) {
              term.write(`\x1b[1;31m[!] Git Push Error: ${err.message}\x1b[0m\r\n`);
            }

          } else if (subCmd === 'pull') {
            term.write(`\x1b[1;36mPulling latest changes...\x1b[0m\r\n`);
            try {
              await git.pull({
                fs,
                http,
                dir: active.currentDir,
                corsProxy: 'https://cors.isomorphic-git.org',
                onAuth: () => ({ username: cfg.token || '' }),
                singleBranch: true
              });
              term.write(`\x1b[1;32m[+] Pull completed successfully!\x1b[0m\r\n`);
            } catch (err) {
              term.write(`\x1b[1;31m[!] Git Pull Error: ${err.message}\x1b[0m\r\n`);
            }

          } else if (subCmd === 'log') {
            try {
              const commits = await git.log({ fs, dir: active.currentDir, depth: 5 });
              for (const c of commits) {
                term.write(`\x1b[1;33mcommit ${c.oid.slice(0, 7)}\x1b[0m - ${c.commit.message}\r\n`);
              }
            } catch (err) {
              term.write(`\x1b[1;31m[!] Git Log Error: ${err.message}\x1b[0m\r\n`);
            }

          } else if (subCmd === 'branch') {
            try {
              const branches = await git.listBranches({ fs, dir: active.currentDir });
              term.write(branches.map(b => `  ${b}`).join('\r\n') + '\r\n');
            } catch (err) {
              term.write(`\x1b[1;31m[!] Git Branch Error: ${err.message}\x1b[0m\r\n`);
            }

          } else if (subCmd === 'checkout') {
            if (!args[2]) return term.write('Usage: git checkout <branch-name>\r\n');
            try {
              await git.checkout({ fs, dir: active.currentDir, ref: args[2] });
              term.write(`\x1b[1;32m[+] Switched to branch '${args[2]}'\x1b[0m\r\n`);
            } catch (err) {
              term.write(`\x1b[1;31m[!] Git Checkout Error: ${err.message}\x1b[0m\r\n`);
            }

          } else if (subCmd === 'remote') {
            if (args[2] === 'add' && args[3] && args[4]) {
              try {
                await git.addRemote({ fs, dir: active.currentDir, remote: args[3], url: args[4] });
                term.write(`\x1b[1;32m[+] Remote '${args[3]}' added successfully.\x1b[0m\r\n`);
              } catch (err) {
                term.write(`\x1b[1;31m[!] Git Remote Error: ${err.message}\x1b[0m\r\n`);
              }
            } else {
              term.write('Usage: git remote add <name> <url>\r\n');
            }

          } else {
            term.write('Usage: git <clone|init|status|add|commit|push|pull|log|branch|checkout|remote>\r\n');
          }
          break;

        default:
          term.write(`${cmd}: command not found. Type 'help' for available commands.\r\n`);
      }
    }

    initFS();
  </script>
</body>
