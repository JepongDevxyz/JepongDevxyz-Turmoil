<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JepongDevxyz - Web TermMax</title>

  <!-- Step 1: Buffer Polyfill -->
  <script src="https://cdn.jsdelivr.net/npm/buffer@6.0.3/index.min.js"></script>
  <script>
    window.Buffer = window.buffer.Buffer;
    if (!window.Buffer.isBuffer) {
      window.Buffer.isBuffer = function(b) {
        return !!(b && b._isBuffer);
      };
    }
  </script>

  <!-- Step 2: External Libraries -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <script src="https://unpkg.com/@isomorphic-git/lightning-fs"></script>
  <script src="https://unpkg.com/isomorphic-git@1.25.0/index.umd.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      background-color: #000;
      color: #00ff66;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: monospace;
    }
    
    /* Dynamic App Container matching Visual Viewport height */
    #app-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    #terminal-container {
      flex: 1;
      width: 100%;
      padding: 5px;
      overflow: hidden;
    }

    #terminal {
      width: 100%;
      height: 100%;
    }
    
    /* Touch Toolbar sitting right above keyboard / bottom of viewport */
    .termux-toolbar {
      height: 50px;
      width: 100%;
      display: flex;
      align-items: center;
      background-color: #1a1a1a;
      border-top: 2px solid #00ff66;
      padding: 0 8px;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      z-index: 9999;
      user-select: none;
      -webkit-user-select: none;
      flex-shrink: 0;
    }

    .termux-btn {
      background-color: #2a2a2a;
      color: #00ff66;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: bold;
      font-family: monospace;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      flex-shrink: 0;
    }
    .termux-btn:active {
      background-color: #00ff66;
      color: #000;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <div id="terminal-container">
      <div id="terminal"></div>
    </div>

    <!-- Termux Touch Control Bar -->
    <div class="termux-toolbar">
      <button class="termux-btn" onclick="handlePaste()">Paste</button>
      <button class="termux-btn" onclick="handleArrowUp()">↑</button>
      <button class="termux-btn" onclick="handleArrowDown()">↓</button>
      <button class="termux-btn" onclick="handleEnter()">Enter ↩</button>
      <button class="termux-btn" onclick="handleUndo()">Undo</button>
      <button class="termux-btn" onclick="handleRedo()">Redo</button>
    </div>
  </div>

  <script>
    const fs = new LightningFS('JepongFS');
    const pfs = fs.promises;

    // HTTP Client for Isomorphic-Git
    const http = {
      async request({ url, method, headers, body }) {
        let reqBody = body;
        if (body && typeof body[Symbol.asyncIterator] === 'function') {
          const chunks = [];
          for await (const chunk of body) chunks.push(chunk);
          reqBody = Buffer.concat(chunks);
        }

        const res = await fetch(url, {
          method,
          headers,
          body: reqBody
        });

        return {
          url: res.url,
          method: method,
          statusCode: res.status,
          statusMessage: res.statusText,
          headers: Object.fromEntries(res.headers.entries()),
          body: (async function* () {
            const reader = res.body.getReader();
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              yield value;
            }
          })()
        };
      }
    };

    const term = new Terminal({
      cursorBlink: true,
      theme: { background: '#000000', foreground: '#00ff66' }
    });
    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal'));
    fitAddon.fit();

    // Sync Viewport Height with Keyboard State
    function updateViewportHeight() {
      const appContainer = document.getElementById('app-container');
      if (window.visualViewport) {
        appContainer.style.height = `${window.visualViewport.height}px`;
        appContainer.style.top = `${window.visualViewport.offsetTop}px`;
      } else {
        appContainer.style.height = `${window.innerHeight}px`;
      }
      fitAddon.fit();
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', updateViewportHeight);
      window.visualViewport.addEventListener('scroll', updateViewportHeight);
    }
    window.addEventListener('resize', updateViewportHeight);
    updateViewportHeight();

    let currentDir = '/home';
    let currentInput = '';
    
    // Command History & Undo/Redo Stacks
    const commandHistory = [];
    let historyIndex = -1;
    const undoStack = [];
    const redoStack = [];

    async function initFS() {
      try { await pfs.mkdir('/home'); } catch (e) {}
      prompt();
    }

    function prompt() {
      term.write(`\r\n\x1b[1;32mJepongDevxyz@termax\x1b[0m:\x1b[1;34m${currentDir}\x1b[0m$ `);
    }

    async function getAllFiles(dir, baseDir = dir) {
      let results = [];
      const list = await pfs.readdir(dir);
      for (const file of list) {
        if (file === '.git') continue;
        const fullPath = `${dir}/${file}`;
        const relativePath = fullPath.replace(`${baseDir}/`, '').replace(/^\//, '');
        const stat = await pfs.stat(fullPath);
        if (stat.isDirectory()) {
          const res = await getAllFiles(fullPath, baseDir);
          results = results.concat(res);
        } else {
          results.push(relativePath);
        }
      }
      return results;
    }

    term.write('\x1b[1;32mJepongDevxyz Web TermMax (Touch Bar Edition)\x1b[0m\r\n');
    term.write('Type \x1b[1;33mhelp\x1b[0m to list available commands.\r\n');
    initFS();

    function clearCurrentInputLine() {
      while (currentInput.length > 0) {
        currentInput = currentInput.slice(0, -1);
        term.write('\b \b');
      }
    }

    function setInput(text) {
      clearCurrentInputLine();
      currentInput = text;
      term.write(text);
    }

    // Toolbar Buttons Functions
    async function handlePaste() {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          undoStack.push(currentInput);
          redoStack.length = 0;
          currentInput += text;
          term.write(text);
        }
      } catch (err) {
        const text = window.prompt("Paste text here:");
        if (text) {
          undoStack.push(currentInput);
          redoStack.length = 0;
          currentInput += text;
          term.write(text);
        }
      }
    }

    function handleArrowUp() {
      if (commandHistory.length > 0 && historyIndex < commandHistory.length - 1) {
        historyIndex++;
        const prevCmd = commandHistory[commandHistory.length - 1 - historyIndex];
        setInput(prevCmd);
      }
    }

    function handleArrowDown() {
      if (historyIndex > 0) {
        historyIndex--;
        const nextCmd = commandHistory[commandHistory.length - 1 - historyIndex];
        setInput(nextCmd);
      } else if (historyIndex === 0) {
        historyIndex = -1;
        clearCurrentInputLine();
      }
    }

    async function handleEnter() {
      term.write('\r\n');
      const cmdToRun = currentInput.trim();
      if (cmdToRun) {
        commandHistory.push(cmdToRun);
        historyIndex = -1;
      }
      await handleCommand(cmdToRun);
      currentInput = '';
      undoStack.length = 0;
      redoStack.length = 0;
      prompt();
    }

    function handleUndo() {
      if (undoStack.length > 0) {
        redoStack.push(currentInput);
        const lastState = undoStack.pop();
        setInput(lastState);
      }
    }

    function handleRedo() {
      if (redoStack.length > 0) {
        undoStack.push(currentInput);
        const nextState = redoStack.pop();
        setInput(nextState);
      }
    }

    term.onData(async (e) => {
      switch (e) {
        case '\r':
          await handleEnter();
          break;
        case '\u007F':
          if (currentInput.length > 0) {
            undoStack.push(currentInput);
            redoStack.length = 0;
            currentInput = currentInput.slice(0, -1);
            term.write('\b \b');
          }
          break;
        case '\u001b[A':
          handleArrowUp();
          break;
        case '\u001b[B':
          handleArrowDown();
          break;
        default:
          if (e >= ' ' && e <= '~') {
            undoStack.push(currentInput);
            redoStack.length = 0;
            currentInput += e;
            term.write(e);
          }
      }
    });

    async function handleCommand(cmdStr) {
      if (!cmdStr) return;
      
      const args = cmdStr.match(/(?:[^\s"]+|"[^"]*")+/g).map(a => a.replace(/^"|"$/g, ''));
      const cmd = args[0];

      switch (cmd) {
        case 'help':
          term.write('\x1b[1;33m=== FILE SYSTEM COMMANDS ===\x1b[0m\r\n');
          term.write('  \x1b[1;36mls\x1b[0m                 - List files in current folder\r\n');
          term.write('  \x1b[1;36mcd <folder>\x1b[0m        - Change directory\r\n');
          term.write('  \x1b[1;36mmkdir <folder>\x1b[0m     - Create directory\r\n');
          term.write('  \x1b[1;36mrm <target> / -rf\x1b[0m  - Delete file or directory\r\n');
          term.write('  \x1b[1;36mcat <file>\x1b[0m         - Read file content\r\n');
          term.write('  \x1b[1;36mclear\x1b[0m              - Clear terminal\r\n\r\n');

          term.write('\x1b[1;33m=== FULL GITHUB COMMANDS ===\x1b[0m\r\n');
          term.write('  \x1b[1;32mgit clone <url>\x1b[0m    - Clone repository\r\n');
          term.write('  \x1b[1;32mgit init\x1b[0m           - Initialize new local Git repository\r\n');
          term.write('  \x1b[1;32mgit status\x1b[0m         - View modified/staged files\r\n');
          term.write('  \x1b[1;32mgit add .\x1b[0m          - Stage all changes\r\n');
          term.write('  \x1b[1;32mgit commit -m "msg"\x1b[0m- Commit staged changes\r\n');
          term.write('  \x1b[1;32mgit push\x1b[0m           - Push commits to GitHub\r\n');
          term.write('  \x1b[1;32mgit pull\x1b[0m           - Fetch and merge latest changes\r\n');
          term.write('  \x1b[1;32mgit log\x1b[0m            - Show commit history\r\n');
          term.write('  \x1b[1;32mgit branch\x1b[0m         - List local branches\r\n');
          term.write('  \x1b[1;32mgit checkout <bname>\x1b[0m- Switch branch\r\n');
          term.write('  \x1b[1;32mgit remote add <u|r>\x1b[0m- Link local repo to remote URL\r\n');
          break;

        case 'clear':
          term.clear();
          break;

        case 'ls':
          try {
            const files = await pfs.readdir(currentDir);
            term.write(files.join('  ') + '\r\n');
          } catch (err) {
            term.write(`ls: error reading directory\r\n`);
          }
          break;

        case 'mkdir':
          if (!args[1]) return term.write('mkdir: missing operand\r\n');
          try {
            await pfs.mkdir(`${currentDir}/${args[1]}`);
            term.write(`Directory '${args[1]}' created.\r\n`);
          } catch (err) {
            term.write(`mkdir: cannot create directory\r\n`);
          }
          break;

        case 'rm':
          if (!args[1]) return term.write('rm: missing operand\r\n');
          const targetName = args[1] === '-rf' ? args[2] : args[1];
          if (!targetName) return term.write('rm: missing operand\r\n');
          
          const fullPath = targetName.startsWith('/') ? targetName : `${currentDir}/${targetName}`;

          async function removeRecursive(path) {
            try {
              const stat = await pfs.stat(path);
              if (stat.isDirectory()) {
                const files = await pfs.readdir(path);
                for (const file of files) {
                  await removeRecursive(`${path}/${file}`);
                }
                await pfs.rmdir(path);
              } else {
                await pfs.unlink(path);
              }
            } catch (e) {}
          }

          try {
            await removeRecursive(fullPath);
            term.write(`\x1b[1;32m[+] Removed '${targetName}' successfully.\x1b[0m\r\n`);
          } catch (err) {
            term.write(`\x1b[1;31m[!] rm error: ${err.message}\x1b[0m\r\n`);
          }
          break;

        case 'cd':
          if (!args[1] || args[1] === '~') {
            currentDir = '/home';
          } else if (args[1] === '..') {
            const parts = currentDir.split('/').filter(Boolean);
            parts.pop();
            currentDir = '/' + parts.join('/');
            if (currentDir === '') currentDir = '/home';
          } else {
            const target = args[1].startsWith('/') ? args[1] : `${currentDir}/${args[1]}`;
            try {
              const stat = await pfs.stat(target);
              if (stat.isDirectory()) currentDir = target;
              else term.write(`cd: ${args[1]}: Not a directory\r\n`);
            } catch (e) {
              term.write(`cd: ${args[1]}: No such file or directory\r\n`);
            }
          }
          break;

        case 'cat':
          if (!args[1]) return term.write('cat: missing file\r\n');
          try {
            const content = await pfs.readFile(`${currentDir}/${args[1]}`, 'utf8');
            term.write(content.replace(/\n/g, '\r\n') + '\r\n');
          } catch (e) {
            term.write(`cat: ${args[1]}: No such file\r\n`);
          }
          break;

        case 'git':
          const subCmd = args[1];

          if (subCmd === 'init') {
            try {
              await git.init({ fs, dir: currentDir, defaultBranch: 'main' });
              term.write(`\x1b[1;32m[+] Initialized empty Git repository in ${currentDir}\x1b[0m\r\n`);
            } catch (err) {
              term.write(`\x1b[1;31m[!] Git Init Error: ${err.message}\x1b[0m\r\n`);
            }

          } else if (subCmd === 'clone') {
            if (!args[2]) return term.write('Usage: git clone <url>\r\n');
            
            let repoUrl = args[2].replace(/^\[|\]\(.*\)$/g, '').replace(/[()]/g, '');
            const repoName = repoUrl.split('/').pop().replace('.git', '');
            const dirPath = currentDir === '/' ? `/${repoName}` : `${currentDir}/${repoName}`;

            term.write(`\x1b[1;36mCloning into '${repoName}'...\x1b[0m\r\n`);
            try {
              await git.clone({
                fs,
                http,
                dir: dirPath,
                url: repoUrl,
                corsProxy: 'https://cors.isomorphic-git.org',
                noCheckout: false
              });
              term.write(`\x1b[1;32m[+] Clone completed successfully!\x1b[0m\r\n`);
            } catch (err) {
              if (err.message.includes('EEXIST')) {
                term.write(`\x1b[1;33m[!] Folder '${repoName}' already exists. Type 'cd ${repoName}' or 'rm -rf ${repoName}' first.\x1b[0m\r\n`);
              } else if (err.message.includes('Could not find HEAD') || err.message.includes('Empty response') || err.message.includes('404')) {
                try {
                  try { await pfs.mkdir(dirPath); } catch (e) {}
                  await git.init({ fs, dir: dirPath, defaultBranch: 'main' });
                  await git.addRemote({ fs, dir: dirPath, remote: 'origin', url: repoUrl });
                  term.write(`\x1b[1;32m[+] Initialized workspace & connected to remote repository!\x1b[0m\r\n`);
                  term.write(`\x1b[1;36mType 'cd ${repoName}' to enter.\x1b[0m\r\n`);
                } catch (initErr) {
                  term.write(`\x1b[1;31m[!] Git Error: ${initErr.message}\x1b[0m\r\n`);
                }
              } else {
                term.write(`\x1b[1;31m[!] Git Clone Error: ${err.message}\x1b[0m\r\n`);
              }
            }

          } else if (subCmd === 'status') {
            try {
              const statusMatrix = await git.statusMatrix({ fs, dir: currentDir });
              if (!statusMatrix.length) {
                term.write('Nothing to commit, working tree clean\r\n');
              } else {
                for (const [filepath, head, worktree, stage] of statusMatrix) {
                  let state = '';
                  if (head === 1 && worktree === 2 && stage === 2) state = '\x1b[1;33mmodified\x1b[0m';
                  else if (head === 0 && worktree === 2 && stage === 0) state = '\x1b[1;31muntracked\x1b[0m';
                  else if (head === 0 && worktree === 2 && stage === 2) state = '\x1b[1;32mstaged\x1b[0m';
                  if (state) term.write(`  ${state}: ${filepath}\r\n`);
                }
              }
            } catch (err) {
              term.write(`\x1b[1;31m[!] Git Status Error: ${err.message}\x1b[0m\r\n`);
            }

          } else if (subCmd === 'add') {
            const fileTarget = args[2] || '.';
            try {
              if (fileTarget === '.') {
                const filesToStaged = await getAllFiles(currentDir);
                for (const filepath of filesToStaged) {
                  await git.add({ fs, dir: currentDir, filepath });
                }
              } else {
                await git.add({ fs, dir: currentDir, filepath: fileTarget });
              }
              term.write(`\x1b[1;32m[+] Staged changes successfully.\x1b[0m\r\n`);
            } catch (err) {
              term.write(`\x1b[1;31m[!] Git Add Error: ${err.message}\x1b[0m\r\n`);
            }

          } else if (subCmd === 'commit') {
            const flagIndex = args.indexOf('-m');
            const message = flagIndex !== -1 ? args[flagIndex + 1] : 'Update via Web TermMax';
            
            try {
              let sha = await git.commit({
                fs,
                dir: currentDir,
                author: { name: 'JepongDevxyz', email: 'jepong@webterm.com' },
                message: message
              });
              term.write(`\x1b[1;32m[+] Commit created: ${sha.slice(0, 7)}\x1b[0m\r\n`);
            } catch (err) {
              term.write(`\x1b[1;31m[!] Git Commit Error: ${err.message}\x1b[0m\r\n`);
            }

          } else if (subCmd === 'push') {
            const token = window.prompt("Enter GitHub Personal Access Token (PAT):");
            if (!token) return term.write(`\x1b[1;31m[!] Push cancelled: Token required.\x1b[0m\r\n`);

            term.write(`\x1b[1;36mPushing changes to remote repository...\x1b[0m\r\n`);
            try {
              await git.push({
                fs,
                http,
                dir: currentDir,
                corsProxy: 'https://cors.isomorphic-git.org',
                onAuth: () => ({ username: token })
              });
              term.write(`\x1b[1;32m[+] Push successful!\x1b[0m\r\n`);
            } catch (err) {
              term.write(`\x1b[1;31m[!] Git Push Error: ${err.message}\x1b[0m\r\n`);
            }

          } else if (subCmd === 'pull') {
            const token = window.prompt("Enter GitHub PAT (Leave blank if public repo):");
            term.write(`\x1b[1;36mPulling latest changes...\x1b[0m\r\n`);
            try {
              await git.pull({
                fs,
                http,
                dir: currentDir,
                corsProxy: 'https://cors.isomorphic-git.org',
                onAuth: () => ({ username: token || '' }),
                singleBranch: true
              });
              term.write(`\x1b[1;32m[+] Pull completed successfully!\x1b[0m\r\n`);
            } catch (err) {
              term.write(`\x1b[1;31m[!] Git Pull Error: ${err.message}\x1b[0m\r\n`);
            }

          } else if (subCmd === 'log') {
            try {
              const commits = await git.log({ fs, dir: currentDir, depth: 5 });
              for (const c of commits) {
                term.write(`\x1b[1;33mcommit ${c.oid.slice(0, 7)}\x1b[0m - ${c.commit.message}\r\n`);
              }
            } catch (err) {
              term.write(`\x1b[1;31m[!] Git Log Error: ${err.message}\x1b[0m\r\n`);
            }

          } else if (subCmd === 'branch') {
            try {
              const branches = await git.listBranches({ fs, dir: currentDir });
              term.write(branches.map(b => `  ${b}`).join('\r\n') + '\r\n');
            } catch (err) {
              term.write(`\x1b[1;31m[!] Git Branch Error: ${err.message}\x1b[0m\r\n`);
            }

          } else if (subCmd === 'checkout') {
            if (!args[2]) return term.write('Usage: git checkout <branch-name>\r\n');
            try {
              await git.checkout({ fs, dir: currentDir, ref: args[2] });
              term.write(`\x1b[1;32m[+] Switched to branch '${args[2]}'\x1b[0m\r\n`);
            } catch (err) {
              term.write(`\x1b[1;31m[!] Git Checkout Error: ${err.message}\x1b[0m\r\n`);
            }

          } else if (subCmd === 'remote') {
            if (args[2] === 'add' && args[3] && args[4]) {
              try {
                await git.addRemote({ fs, dir: currentDir, remote: args[3], url: args[4] });
                term.write(`\x1b[1;32m[+] Remote '${args[3]}' added successfully.\x1b[0m\r\n`);
              } catch (err) {
                term.write(`\x1b[1;31m[!] Git Remote Error: ${err.message}\x1b[0m\r\n`);
              }
            } else {
              term.write('Usage: git remote add <name> <url>\r\n');
            }

          } else {
            term.write('Usage: git <clone|init|status|add|commit|push|pull|log|branch|checkout|remote>\r\n');
          }
          break;

        default:
          term.write(`${cmd}: command not found. Type 'help' for available commands.\r\n`);
      }
    }
  </script>
</body>
</html>
